name: macOS Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: 设置 mvnw 可执行权限
        run: chmod +x ./mvnw

      - name: 编译项目
        run: ./mvnw clean package -DskipTests

      - name: 复制运行时依赖
        run: ./mvnw dependency:copy-dependencies -DoutputDirectory=target/deps -DincludeScope=runtime

      - name: 下载 JavaFX jmod 和 SDK
        run: |
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            PLATFORM="osx-aarch64"
          else
            PLATFORM="osx-x64"
          fi

          echo "架构: $ARCH -> $PLATFORM"

          JAVAFX_VERSION="17.0.2"
          JAVAFX_URL="https://download2.gluonhq.com/openjfx/${JAVAFX_VERSION}/openjfx-${JAVAFX_VERSION}_${PLATFORM}"

          echo "下载 JavaFX jmod..."
          for i in 1 2 3; do
            echo "尝试 (第${i}次)..."
            if curl -L --connect-timeout 30 --max-time 300 -o javafx-jmods.zip \
               "${JAVAFX_URL}_bin-jmods.zip"; then
              echo "jmod 下载成功"
              break
            fi
            [ "$i" -eq 3 ] && echo "jmod 下载失败" && exit 1
            sleep 5
          done

          echo "下载 JavaFX SDK (原生库)..."
          for i in 1 2 3; do
            echo "尝试 (第${i}次)..."
            if curl -L --connect-timeout 30 --max-time 300 -o javafx-sdk.zip \
               "${JAVAFX_URL}_bin-sdk.zip"; then
              echo "SDK 下载成功"
              break
            fi
            [ "$i" -eq 3 ] && echo "SDK 下载失败" && exit 1
            sleep 5
          done

          unzip -o javafx-jmods.zip -d javafx-jmods
          unzip -o javafx-sdk.zip -d javafx-sdk

          echo "=== jmod 文件 ==="
          find javafx-jmods -name "*.jmod" | head -20
          echo "=== SDK 原生库 ==="
          find javafx-sdk -name "*.dylib" | head -20

      - name: 创建自定义运行时 (jlink)
        run: |
          JMOD_DIR=$(find javafx-jmods -name "lib" -type d | head -1)
          echo "jmod 目录: $JMOD_DIR"

          $JAVA_HOME/bin/jlink \
            --module-path "$JMOD_DIR" \
            --add-modules java.base,java.desktop,java.xml,jdk.unsupported,javafx.base,javafx.controls,javafx.fxml,javafx.graphics \
            --output target/runtime \
            --no-header-files \
            --no-man-pages \
            --compress=2

          echo "运行时大小:"
          du -sh target/runtime

      - name: 准备打包文件
        run: |
          mkdir -p target/jpackage-input
          cp target/batchfile_app-0.0.1-SNAPSHOT.jar target/jpackage-input/
          cp target/deps/*.jar target/jpackage-input/
          echo "打包文件:"
          ls -la target/jpackage-input/

      - name: 打包 DMG
        run: |
          jpackage --input target/jpackage-input \
                   --name BatchRenameTool \
                   --main-jar batchfile_app-0.0.1-SNAPSHOT.jar \
                   --main-class com.rt.batchfile_app.BatchfileAppApplication \
                   --dest target/dist \
                   --type dmg \
                   --app-version 1.0.0 \
                   --vendor RT \
                   --runtime-image target/runtime \
                   --java-options "-Dfile.encoding=UTF-8" \
                   --java-options "-Dprism.allowhidpi=false" \
                   --verbose

      - name: 上传 DMG 产物
        uses: actions/upload-artifact@v4
        with:
          name: BatchRenameTool-DMG
          path: target/dist/*.dmg
          retention-days: 30

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: target/dist/*.dmg
          name: "BatchRenameTool ${{ github.ref_name }}"
          body: |
            ## macOS 安装包

            ### 安装步骤：
            1. 下载 `.dmg` 文件
            2. 双击打开 DMG
            3. 将 BatchRenameTool 拖拽到 Applications 文件夹
            4. 首次运行：右键点击应用 → 选择"打开" → 再次点击"打开"

            > 注意：此应用未经 Apple 签名，首次打开需要手动允许
          draft: false
          prerelease: false
